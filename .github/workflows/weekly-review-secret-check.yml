name: Weekly Review - secret check only

# No push, PR, schedule or live benchmark trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpgfitness-benchmark
  cancel-in-progress: false

jobs:
  offline-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dry-run without a secret or installed dependencies
        env:
          BENCH_ALLOW_PAID: 'NO'
          OPENAI_API_KEY: ''
        run: node --experimental-strip-types tools/weekly-review-benchmark/harness.ts --dry-run --repeats=1

  secret-check:
    needs: offline-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: rpgfitness-benchmark
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check injection only - no API, output, file or hash of the key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BENCH_ALLOW_PAID: 'NO'
          NODE_DEBUG: ''
          NODE_DEBUG_NATIVE: ''
          NODE_OPTIONS: ''
        run: node --experimental-strip-types tools/weekly-review-benchmark/security.ts
