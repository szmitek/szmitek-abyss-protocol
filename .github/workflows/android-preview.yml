name: Android Preview APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-preview.*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Abyss-Protocol-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Abyss-Protocol-APK
          path: Abyss-Protocol-preview.apk
          retention-days: 14
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: Abyss-Protocol-preview.apk
