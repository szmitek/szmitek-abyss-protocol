name: Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build standalone release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Abyss-Protocol-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Abyss-Protocol-APK
          path: Abyss-Protocol-preview.apk
          retention-days: 14
      - name: Publish preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview.2
          target_commitish: ${{ github.sha }}
          name: Abyss Protocol 0.1.0 Preview 2
          prerelease: true
          generate_release_notes: true
          files: Abyss-Protocol-preview.apk
