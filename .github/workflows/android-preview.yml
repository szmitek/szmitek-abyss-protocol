name: Android Preview APK

env:
  EXPO_NO_TELEMETRY: '1'

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.scope.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether application export is needed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync, appendFileSync } = require('node:fs');
          let needed = true;
          try {
            const base = process.env.BASE_SHA;
            if (!/^[0-9a-f]{40}$/.test(base) || /^0+$/.test(base)) throw Error('No comparison base');
            const files = execFileSync('git', ['diff', '--name-only', base, 'HEAD'], { encoding: 'utf8' }).trim().split('\n');
            const onlyBenchmark = files.every(p => p.startsWith('tools/weekly-review-benchmark/') || p.startsWith('docs/') || ['tests/weeklyBenchmark.test.ts', 'package.json', '.gitignore', '.github/workflows/quality.yml', '.github/workflows/weekly-review-secret-check.yml', '.github/workflows/weekly-review-benchmark.yml', '.github/workflows/weekly-review-sol-w01.yml', '.github/workflows/weekly-review-v2-w01.yml', '.github/workflows/android-preview.yml'].includes(p));
            const oldPackage = JSON.parse(execFileSync('git', ['show', `${base}:package.json`], { encoding: 'utf8' }));
            const newPackage = JSON.parse(readFileSync('package.json', 'utf8'));
            delete oldPackage.scripts['benchmark:weekly'];
            delete newPackage.scripts['benchmark:weekly'];
            needed = !onlyBenchmark || JSON.stringify(oldPackage) !== JSON.stringify(newPackage);
          } catch { /* Unknown scope keeps the application verification gate. */ }
          appendFileSync(process.env.GITHUB_OUTPUT, `app_changed=${needed}\n`);
          NODE
  build-apk:
    needs: scope
    if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build standalone release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Abyss-Protocol-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Abyss-Protocol-APK
          path: Abyss-Protocol-preview.apk
          retention-days: 14
      - name: Publish preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview.4
          target_commitish: ${{ github.sha }}
          name: Abyss Protocol 0.1.0 Preview 4
          prerelease: true
          generate_release_notes: true
          files: Abyss-Protocol-preview.apk
