name: Weekly Review - W01 v2 comparison

# Manual only. Creating this workflow is not authorization to spend.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'One model per run; use the same v2 input for both.'
        type: choice
        options: ['sol', 'astra']
        default: 'sol'
        required: true
      allow_paid:
        description: 'Select YES only after separate approval of this paid session (one W01: Sol up to 1.80 PLN / Astra up to 4.40 PLN; no retry).'
        type: choice
        options: ['NO', 'YES']
        default: 'NO'
        required: true

permissions:
  contents: read

concurrency:
  group: rpgfitness-benchmark
  cancel-in-progress: false

env:
  BENCH_MAX_RUN_PLN: ${{ inputs.model == 'sol' && '1.80' || '4.40' }}
  BENCH_MAX_SESSION_PLN: ${{ inputs.model == 'sol' && '1.80' || '4.40' }}
  BENCH_PLN_PER_USD: '4'
  BENCH_MAX_OUTPUT_TOKENS: '4096'
  NODE_DEBUG: ''
  NODE_DEBUG_NATIVE: ''
  NODE_OPTIONS: ''

jobs:
  dry-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate fixed v2 W01 without credentials or HTTP
        env:
          OPENAI_API_KEY: ''
          BENCH_ALLOW_PAID: 'NO'
        run: node --experimental-strip-types tools/weekly-review-benchmark/v2-w01.ts --dry-run --model=${{ inputs.model }}

  paid-pilot:
    needs: dry-run
    if: github.ref == 'refs/heads/main' && inputs.allow_paid == 'YES'
    environment: rpgfitness-benchmark
    permissions:
      contents: write # Only needed for the durable budget branch; no extra PAT.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reserve fixed model budget, then execute one authorized v2 W01
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BENCH_ALLOW_PAID: ${{ inputs.allow_paid }}
        run: node --experimental-strip-types tools/weekly-review-benchmark/v2-w01.ts --live --model=${{ inputs.model }}
      - name: Preserve synthetic benchmark results, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-v2-${{ inputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark-results/live-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
