name: Weekly Review - Astra medium pilot

# Manual only. Creating this workflow is not authorization to spend.
on:
  workflow_dispatch:
    inputs:
      allow_paid:
        description: 'Select YES only after separate approval of this paid session (up to 5 PLN).'
        type: choice
        options: ['NO', 'YES']
        default: 'NO'
        required: true

permissions:
  contents: read

concurrency:
  group: rpgfitness-benchmark
  cancel-in-progress: false

env:
  BENCH_MAX_RUN_PLN: '5'
  BENCH_MAX_SESSION_PLN: '5'
  BENCH_PLN_PER_USD: '4'
  BENCH_MAX_OUTPUT_TOKENS: '4096'
  NODE_DEBUG: ''
  NODE_DEBUG_NATIVE: ''
  NODE_OPTIONS: ''

jobs:
  dry-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate remaining seven medium cases without credentials or HTTP
        env:
          OPENAI_API_KEY: ''
          BENCH_ALLOW_PAID: 'NO'
        run: node --experimental-strip-types tools/weekly-review-benchmark/harness.ts --dry-run --effort=medium --repeats=1 --cases=remaining --payload=compact

  paid-pilot:
    needs: dry-run
    if: github.ref == 'refs/heads/main' && inputs.allow_paid == 'YES'
    environment: rpgfitness-benchmark
    permissions:
      contents: write # Only needed for the durable budget branch; no extra PAT.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reserve session budget, then execute authorized medium-only pilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BENCH_ALLOW_PAID: ${{ inputs.allow_paid }}
        run: node --experimental-strip-types tools/weekly-review-benchmark/harness.ts --live --effort=medium --repeats=1 --cases=remaining --payload=compact
      - name: Preserve synthetic benchmark results, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-medium-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark-results/live-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
