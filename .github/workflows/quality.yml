name: Quality

env:
  EXPO_NO_TELEMETRY: '1'
  EXPO_OFFLINE: '1'

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check whether application export is needed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync, appendFileSync } = require('node:fs');
          let needed = true;
          try {
            const base = process.env.BASE_SHA;
            if (!/^[0-9a-f]{40}$/.test(base) || /^0+$/.test(base)) throw Error('No comparison base');
            const files = execFileSync('git', ['diff', '--name-only', base, 'HEAD'], { encoding: 'utf8' }).trim().split('\n');
            const onlyBenchmark = files.every(p => p.startsWith('tools/weekly-review-benchmark/') || p.startsWith('docs/') || ['tests/weeklyBenchmark.test.ts', 'package.json', '.gitignore', '.github/workflows/quality.yml', '.github/workflows/weekly-review-secret-check.yml'].includes(p));
            const oldPackage = JSON.parse(execFileSync('git', ['show', `${base}:package.json`], { encoding: 'utf8' }));
            const newPackage = JSON.parse(readFileSync('package.json', 'utf8'));
            delete oldPackage.scripts['benchmark:weekly'];
            delete newPackage.scripts['benchmark:weekly'];
            needed = !onlyBenchmark || JSON.stringify(oldPackage) !== JSON.stringify(newPackage);
          } catch { /* Unknown scope keeps the application verification gate. */ }
          appendFileSync(process.env.GITHUB_OUTPUT, `app_changed=${needed}\n`);
          NODE
      - run: npm run build:android
        if: steps.scope.outputs.app_changed == 'true'
